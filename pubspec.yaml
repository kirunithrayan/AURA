name: aura
description: "AURA — Adaptive Unified Repository Assistant. AI-powered Knowledge Workspace for Android."
publish_to: 'none'
version: 0.6.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Dependency Injection
  get_it: ^8.0.2

  # Functional Programming
  fpdart: ^1.1.1

  # Database
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.2

  # Background Processing
  workmanager: ^0.9.0

  # AI / ML
  flutter_onnxruntime: ^1.8.3

  # OCR
  google_mlkit_text_recognition: ^0.14.0

  # Routing
  go_router: ^14.6.2

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # File Picking
  file_picker: ^8.1.6

  # PDF
  pdfx: ^2.7.0
  syncfusion_flutter_pdfviewer: ^28.2.3
  # Text extraction for search indexing. Already resolved transitively via
  # syncfusion_flutter_pdfviewer; declared directly so the parser import is
  # not a reference to an undeclared package. No new package is pulled in.
  syncfusion_flutter_pdf: ^28.2.3

  # Image Viewing
  photo_view: ^0.15.0

  # Graph Visualization
  graphview: ^1.2.0

  # Icons
  material_symbols_icons: ^4.2796.0

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  crypto: ^3.0.3

  # Parsing
  archive: ^3.6.1
  xml: ^6.3.0

  # Native APIs
  share_plus: ^7.2.1
  url_launcher: ^6.3.2
  # Native Android/iOS print dialog (PrintManager / UIPrintInteractionController).
  # No custom printer UI is built on top of it.
  printing: ^5.14.2
  # Already resolved transitively via printing; declared directly so
  # document_print_service_impl.dart's import is not a reference to an
  # undeclared package. No new package is pulled in.
  pdf: ^3.12.0
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  mockito: ^5.4.6
  # Already resolved transitively via path_provider; declared directly so
  # document_share_service_test.dart's fake PathProviderPlatform is not a
  # reference to an undeclared package. No new package is pulled in.
  path_provider_platform_interface: ^2.1.3
  # Host-side (desktop) SQLite driver for real-database integration tests.
  # Test-only; the app ships on sqflite_sqlcipher. Lets the multi-table
  # workspace-deletion transaction run against a real in-memory SQLite DB
  # instead of a fake datasource. See test/features/workspace/
  # workspace_deletion_datasource_test.dart.
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.14.1

# Android launcher icon generation (AURA brand identity).
# Sources live in assets/launcher/ (not bundled into the app).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  min_sdk_android: 24
  image_path: "assets/launcher/aura-legacy.png"
  adaptive_icon_foreground: "assets/launcher/aura-fg.png"
  adaptive_icon_background: "assets/launcher/aura-bg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/

  # Design System v1.0 typography. Two families, static instances.
  # Inter = interface (400/500/600). Source Serif 4 = reading (400/600).
  # Both OFL-licensed; license files live in assets/fonts/.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceSerif4-SemiBold.otf
          weight: 600
